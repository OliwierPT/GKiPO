repos:
  # Standard pre-commit housekeeping hooks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files

  # Ruff for lightning-fast linting and code formatting
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.3
    hooks:
      # Run the linter
      - id: ruff
        args: [--fix]
      # Run the formatter
      - id: ruff-format

  # Pytest as a local hook (runs using your active virtual environment's dependencies)
  - repo: local
    hooks:
      - id: pytest
        name: run pytest
        entry: pytest
        language: system
        types: [python]
        pass_filenames: false
        always_run: true
